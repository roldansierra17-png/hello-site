<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi, I'm Roldan</title>
  <meta name="description" content="Roldan's website is live.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1c1a17;
      --muted: #6b655c;
      --accent: #1f9d55;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141311; --ink: #f2eee8; --muted: #a39d93; --accent: #3ccf7a; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
    }
    main { max-width: 640px; text-align: center; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: .02em;
      margin-bottom: 28px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
      70% { box-shadow: 0 0 0 12px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span>Online</div>
    <h1>Hi, I'm Roldan and my website is <span>live.</span></h1>
  </main>
</body>
</html>
